<!DOCTYPE html>
<html>

<head>

<style>

body{
font-family: Arial;
padding:20px;
}

.header{
background:#1f2937;
color:white;
padding:20px;
}

.good{
color:green;
}

.bad{
color:red;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
border:1px solid black;
padding:10px;
}

</style>

</head>

<body>

<div class="header">

<h1>{{ title }}</h1>

</div>

<p>Score: {{ score }}</p>

<p class="good">
{{ strengths }}
</p>

<p class="bad">
{{ weaknesses }}
</p>

<table>

<tr>
<th>Item</th>
<th>Cost</th>
</tr>

{% for item in pricing %}

<tr>

<td>{{ item.name }}</td>

<td>{{ item.cost }}</td>

</tr>

{% endfor %}

</table>

</body>

</html>
